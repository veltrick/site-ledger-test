name: Build SITE LEDGER APK

on:
  push:
    paths:
      - ".github/workflows/build-site-ledger-apk.yml"
      - "SITE_LEDGER_Phase_2B_Build_Ready.zip"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project from uploaded ZIP
        run: |
          test -f SITE_LEDGER_Phase_2B_Build_Ready.zip
          mkdir source
          unzip -q SITE_LEDGER_Phase_2B_Build_Ready.zip -d source
          test -f source/android-project/settings.gradle.kts
          test -f source/android-project/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build installable debug APK
        working-directory: source/android-project
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK for phone installation
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SITE-LEDGER-DEBUG-APK
          path: source/android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
